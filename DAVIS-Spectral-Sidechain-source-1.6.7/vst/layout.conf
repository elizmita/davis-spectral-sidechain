theme_ink_dim=6b6a63
theme_accent=26292e
theme_accent_hi=3a3f46
theme_line=a9a8a0
theme_box=d6d5cd
theme_lcd=d6d5cd
theme_seg_active=26292e
theme_seg_inactive=c9c8bf
theme_seg_active_tx=f2f1ee
art_css=skin.css

[tab SPECTRAL SIDECHAIN]
art file="artwork/bg_user.png"

