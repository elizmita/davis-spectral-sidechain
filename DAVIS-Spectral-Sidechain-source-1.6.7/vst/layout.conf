# DAVIS Spectral Sidechain. Written by tools/make_skin.py: edit the design there and rerun it, not this file.
# A free band on top for the logo; the graph (the band's curve, the live ring), a big Freq slider, six knobs, mode/channel/GR/SC.
# Layout y = skin y + 86.

